name: Build macOS App

on:
  workflow_dispatch: # Allows you to trigger this manually on GitHub

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build Next.js and Electron for Mac
        run: npm run build

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Shleve-macOS
          path: dist/*.dmg
