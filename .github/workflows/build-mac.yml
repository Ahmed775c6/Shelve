name: Build Desktop Apps

on:
  workflow_dispatch: # Trigger manually from the Actions tab on GitHub

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        shell: bash
        run: |
          printf "%s\n" "${{ secrets.ENV_FILE }}" > .env

      - name: Build Next.js and Electron
        run: npm run next:build && npx electron-builder --publish never

      - name: Upload Built Installer
        uses: actions/upload-artifact@v4
        with:
          name: Shelve-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
