<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shelve - Loading...</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background: #0f0e0c;
            color: #c9a96e;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            height: 100vh;
            justify-content: center;
            margin: 0;
        }

        .titlebar {
            align-items: center;
            background: #0f0e0c;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            height: 40px;
            left: 0;
            position: fixed;
            right: 0;
            top: 0;
            user-select: none;
        }

        .drag-region {
            -webkit-app-region: drag;
            align-items: center;
            display: flex;
            flex: 1;
            height: 100%;
        }

        .titlebar button {
            -webkit-app-region: no-drag;
            align-items: center;
            background: transparent;
            border: 0;
            color: #e4e2dd;
            cursor: pointer;
            display: inline-flex;
            height: 36px;
            justify-content: center;
            width: 40px;
        }

        .titlebar button:hover {
            background: rgba(255,255,255,0.1);
        }

        .titlebar button:disabled {
            color: rgba(255,255,255,0.3);
            cursor: default;
        }

        .titlebar button:disabled:hover {
            background: transparent;
        }

        .window-controls {
            display: flex;
            height: 100%;
        }

        .window-controls button {
            -webkit-app-region: no-drag;
        }

        .window-controls #close:hover {
            background: #e05252;
            color: white;
        }

        .brand {
            color: #c9a96e;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            margin-left: 8px;
        }

        .logo {
            background: url("../public/icon.png") center / contain no-repeat;
            height: 96px;
            width: 96px;
        }

        p {
            font-size: 15px;
            margin: 20px 0 0;
        }
    </style>
</head>
<body>
    <header class="titlebar">
        <div class="drag-region">
            <button type="button" aria-label="Go back" title="Go back" disabled>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button type="button" aria-label="Go forward" title="Go forward" disabled>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button type="button" aria-label="Reload page" title="Reload page" onclick="window.location.reload()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7v5h-5"/><path d="M20 12a8 8 0 1 1-2.34-5.66L20 9"/></svg>
            </button>
            <span class="brand">Shelve</span>
        </div>
        <div class="window-controls">
            <button type="button" aria-label="Minimize window" title="Minimize" onclick="window.windowControls?.minimize()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
            </button>
            <button type="button" aria-label="Maximize window" title="Maximize" onclick="window.windowControls?.toggleMaximize()">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>
            </button>
            <button id="close" type="button" aria-label="Close window" title="Close" onclick="window.windowControls?.close()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 6-12 12M6 6l12 12"/></svg>
            </button>
        </div>
    </header>
    <div class="logo" role="img" aria-label="Shelve logo"></div>
    <p>Just a sec ...</p>
</body>
</html>
